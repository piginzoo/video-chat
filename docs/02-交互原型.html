<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频讲解器 · 高保真交互原型</title>
<style>
:root{
  --accent:#2e7d46; --accent-weak:#e8f3ec; --accent-line:#bfe0cb;
  --bg:#eceef1; --panel:#ffffff; --line:#e5e7eb;
  --text:#1f2329; --text2:#6b7280; --text3:#9ca3af;
  --ytred:#ff0033; --bbpink:#fb7299;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); font-size:14px; padding-bottom:28px;}

/* ============ 原型控制台 ============ */
.proto-bar{position:fixed; bottom:0; left:0; right:0; height:28px; background:#111827; color:#d1d5db; display:flex; align-items:center; gap:10px; padding:0 14px; font-size:12px; z-index:99;}
.proto-bar b{color:#fbbf24;}
.proto-bar .scenarios{display:flex; gap:6px; margin-left:8px;}
.proto-bar button{background:#374151; color:#e5e7eb; border:1px solid #4b5563; border-radius:6px; padding:2px 10px; font-size:12px; cursor:pointer;}
.proto-bar button.on{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ============ 场景布局 ============ */
.scene{display:flex; justify-content:center; gap:0; padding:22px 12px 40px; min-width:1100px;}
.callout{writing-mode:vertical-rl; align-self:center; color:var(--accent); font-size:12px; letter-spacing:2px; margin-right:6px; opacity:.85;}

/* ============ 假浏览器 ============ */
.browser{width:660px; background:#f3f4f6; border-radius:12px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; height:820px;}
.chrome-top{background:#dde0e5; padding:8px 12px 0;}
.traffic{display:flex; gap:6px; margin-bottom:8px;}
.traffic i{width:11px;height:11px;border-radius:50%;}
.traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.tabstrip{display:flex; align-items:flex-end; gap:6px;}
.wtab{background:#f3f4f6; border-radius:8px 8px 0 0; padding:6px 12px; font-size:12px; color:var(--text2); display:flex; align-items:center; gap:6px; max-width:300px; white-space:nowrap; overflow:hidden;}
.wtab img{width:14px;height:14px;border-radius:3px;}
.wtab span{overflow:hidden;text-overflow:ellipsis;}
.toolbar{background:#f3f4f6; display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid #e5e7eb;}
.navbtns{color:#9ca3af; font-size:15px; letter-spacing:4px;}
.urlbar{flex:1; background:#fff; border-radius:99px; padding:6px 14px; font-size:12px; color:var(--text2); border:1px solid #e5e7eb; white-space:nowrap; overflow:hidden;}
.exticon{width:22px;height:22px;border-radius:5px; padding:1px; background:var(--accent-weak); border:1.5px solid var(--accent);}
.page{flex:1; background:#fff; overflow:hidden; display:flex; flex-direction:column;}

/* ============ 假视频页 ============ */
.sitehead{height:44px; display:flex; align-items:center; padding:0 18px; color:#fff; font-weight:600; font-size:15px; flex:none;}
.sitehead.yt{background:#0f0f0f;}
.sitehead.bili{background:#fff; color:var(--bbpink); border-bottom:1px solid #f1f2f3;}
.player{background:#0f0f0f; position:relative; flex:none;}
.player .frame{aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;}
.frame .vtitle{position:absolute; top:14px; left:16px; color:rgba(255,255,255,.92); font-size:16px; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.6); max-width:70%;}
.frame .poster{position:absolute; inset:0; opacity:.9;}
.centerplay{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.85); color:#fff; font-size:24px; cursor:pointer; display:flex;align-items:center;justify-content:center; z-index:2; transition:.2s;}
.centerplay:hover{transform:scale(1.08); background:var(--accent);}
.controls{display:flex; align-items:center; gap:10px; padding:8px 14px 10px; color:#e5e7eb; font-size:12px; background:#0f0f0f; flex:none;}
.controls .btn{cursor:pointer; font-size:15px; width:22px; text-align:center;}
.track{flex:1; height:14px; display:flex; align-items:center; cursor:pointer;}
.track .rail{width:100%; height:4px; background:#3f3f46; border-radius:2px; position:relative;}
.track .fill{position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:2px;}
.track .dot{position:absolute; top:50%; transform:translate(-50%,-50%); width:11px;height:11px;border-radius:50%; background:#fff;}
.videotitle-row{padding:12px 18px 4px; font-size:15px; font-weight:600;}
.videochannel{padding:0 18px; color:var(--text2); font-size:12px;}
.fakepage-body{padding:14px 18px; color:var(--text2); font-size:13px; line-height:1.9; overflow:hidden;}

/* ============ 侧边栏 ============ */
.sidepanel{width:400px; height:820px; background:var(--panel); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line);}
.sp-head{display:flex; align-items:center; gap:9px; padding:11px 14px 9px; border-bottom:1px solid var(--line); flex:none;}
.sp-head img.logo{width:26px;height:26px;border-radius:50%; box-shadow:0 0 0 1.5px var(--accent-line);}
.sp-head .name{font-weight:700; font-size:15px;}
.sp-head .ver{font-size:11px; color:var(--text3); background:#f3f4f6; border-radius:99px; padding:1px 8px;}
.tabs{display:flex; border-bottom:1px solid var(--line); flex:none;}
.tabs .tab{flex:1; text-align:center; padding:9px 0; color:var(--text2); cursor:pointer; font-size:13.5px; border-bottom:2.5px solid transparent; user-select:none;}
.tabs .tab.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
.sp-body{flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column;}
.tabpane{flex:1; overflow:hidden; display:none; flex-direction:column;}
.tabpane.on{display:flex;}
.sp-foot{flex:none; display:flex; align-items:center; gap:7px; padding:7px 14px; border-top:1px solid var(--line); color:var(--text3); font-size:11px; background:#fafafa;}
.sp-foot img{width:15px;height:15px;border-radius:50%;}

/* 空态 */
.empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text2); padding:30px;}
.empty-state img{width:64px;height:64px;border-radius:50%; opacity:.35; filter:grayscale(1);}
.empty-state h3{color:var(--text); font-size:15px;}
.empty-state p{font-size:12.5px; line-height:1.8; text-align:center;}
.empty-state .sites{font-size:12px; color:var(--text3); background:#f7f8fa; border:1px dashed var(--line); padding:6px 14px; border-radius:8px;}

/* ============ 脚本 Tab ============ */
.script-wrap{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.info-card{padding:12px 14px 10px; border-bottom:1px solid var(--line); flex:none;}
.info-card .t{font-weight:600; font-size:13.5px; line-height:1.5;}
.info-card .meta{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:11.5px; color:var(--text2); flex-wrap:wrap;}
.badge{background:#f3f4f6; border-radius:99px; padding:2px 9px;}
.badge.lang{background:var(--accent-weak); color:var(--accent);}
.infobar{display:flex; align-items:center; gap:8px; margin-top:8px;}
.trackselect{flex:1; font-size:12px; padding:4px 8px; border:1px solid var(--line); border-radius:7px; color:var(--text2); background:#fff;}
.langtoggle{font-size:11.5px; color:var(--accent); border:1px solid var(--accent-line); background:var(--accent-weak); padding:4px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;}
.trans-progress{margin-top:8px;}
.trans-progress .label{display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:4px;}
.trans-progress .label .done{color:var(--accent); font-weight:600;}
.pbar{height:4px; background:#eef0f2; border-radius:2px; overflow:hidden;}
.pbar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#6cbf8a); transition:width .18s;}
.follow-pill{margin-left:auto; font-size:10.5px; padding:2px 8px; border-radius:99px; background:#eefbf1; color:var(--accent); border:1px solid var(--accent-line); transition:.2s;}
.follow-pill.paused{background:#fef3e2; color:#b45309; border-color:#fcd9a8;}
.transcript{flex:1; overflow-y:auto; padding:8px 10px 14px;}
.row{padding:7px 9px; border-radius:8px; cursor:pointer; transition:background .15s; border:1px solid transparent;}
.row:hover{background:#f5f7f8;}
.row.cur{background:var(--accent-weak); border-color:var(--accent-line);}
.row .ts{font-size:10.5px; color:var(--text3); font-variant-numeric:tabular-nums;}
.row.cur .ts{color:var(--accent); font-weight:700;}
.row .en{font-size:12.5px; margin-top:2px; line-height:1.55;}
.row .zh{font-size:12px; color:var(--text2); margin-top:2px; line-height:1.55; transition:opacity .4s;}
.row .zh.pending{opacity:.25;}
.only-en .row .zh{display:none;}
.skeletonline{height:12px; border-radius:6px; background:linear-gradient(90deg,#eef0f2,#f7f8fa,#eef0f2); background-size:200% 100%; animation:sk 1.2s infinite;}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* 无字幕兜底 */
.nosub-card{margin:14px; border:1px solid #fde3c8; background:#fffaf3; border-radius:10px; padding:14px;}
.nosub-card h4{font-size:13.5px; color:#b45309;}
.nosub-card p{font-size:12px; color:var(--text2); line-height:1.7; margin:6px 0 10px;}
.nosub-card textarea{width:100%; height:110px; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; resize:vertical; font-family:inherit; color:var(--text);}
.nosub-card .go{margin-top:8px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 16px; font-size:12.5px; cursor:pointer;}
.pasted-note{margin:10px 14px 0; font-size:11.5px; color:var(--text2); background:#f7f8fa; border:1px dashed var(--line); border-radius:8px; padding:7px 10px;}
.plainlist{padding:10px 14px;}
.plainlist .pline{font-size:12.5px; line-height:1.8; color:#374151; border-bottom:1px dashed #f0f1f3; padding:3px 0;}

/* ============ 对话 Tab ============ */
.chat-wrap{flex:1; display:flex; flex-direction:column; overflow:hidden;}
.ctx-chip{display:flex; align-items:center; gap:6px; margin:10px 12px 0; padding:7px 10px; background:var(--accent-weak); border:1px solid var(--accent-line); border-radius:8px; font-size:11.5px; color:var(--accent);}
.ctx-chip .clr{margin-left:auto; color:var(--text3); cursor:pointer; font-size:11px; white-space:nowrap;}
.ctx-chip .clr:hover{color:#ef4444;}
.msgs{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px;}
.msg{max-width:88%; display:flex; flex-direction:column; gap:3px;}
.msg .who{font-size:10.5px; color:var(--text3);}
.msg .bubble{padding:9px 12px; border-radius:12px; font-size:12.8px; line-height:1.75; word-break:break-word;}
.msg.u{align-self:flex-end; align-items:flex-end;}
.msg.u .bubble{background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
.msg.a{align-self:flex-start;}
.msg.a .bubble{background:#f4f5f7; border-bottom-left-radius:4px;}
.msg.a .bubble a.ts{color:var(--accent); font-weight:600; text-decoration:none; background:var(--accent-weak); border-radius:4px; padding:0 3px; cursor:pointer;}
.msg.a .bubble a.ts:hover{background:var(--accent-line);}
.msg.a .bubble pre{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.6; background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin:4px 0; white-space:pre; overflow-x:auto;}
.cursor{display:inline-block; width:7px; height:13px; background:var(--accent); vertical-align:-2px; animation:blink .8s infinite; border-radius:1.5px;}
@keyframes blink{50%{opacity:0}}
.chat-input-zone{flex:none; border-top:1px solid var(--line); padding:8px 12px 10px; background:#fff;}
.quickbtns{display:flex; gap:8px; margin-bottom:8px;}
.qbtn{display:flex; align-items:center; gap:5px; background:var(--accent-weak); border:1px solid var(--accent-line); color:var(--accent); font-size:12px; padding:5px 12px; border-radius:99px; cursor:pointer; transition:.15s;}
.qbtn:hover{background:var(--accent); color:#fff;}
.qbtn:disabled{opacity:.5; cursor:not-allowed;}
.inputrow{display:flex; gap:8px;}
.inputrow textarea{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 11px; font-size:13px; font-family:inherit; resize:none; height:40px; color:var(--text); line-height:1.5;}
.inputrow textarea:focus{outline:none; border-color:var(--accent);}
.sendbtn{background:var(--accent); color:#fff; border:none; border-radius:10px; width:58px; font-size:13px; cursor:pointer;}
.sendbtn:disabled{background:#c3cdd6; cursor:not-allowed;}

/* ============ 设置 Tab ============ */
.settings{flex:1; overflow-y:auto; padding:14px;}
.provider-pick{display:flex; gap:8px; margin-bottom:14px;}
.prov{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; transition:.15s; background:#fff;}
.prov .pn{font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px;}
.prov .pd{font-size:11px; color:var(--text2); margin-top:3px;}
.prov.on{border-color:var(--accent); background:var(--accent-weak);}
.prov .radio{width:14px;height:14px;border-radius:50%; border:1.5px solid #c4ccd4; position:relative; flex:none;}
.prov.on .radio{border-color:var(--accent);}
.prov.on .radio::after{content:""; position:absolute; inset:2.5px; border-radius:50%; background:var(--accent);}
.cfg-card{border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px;}
.cfg-card.hidden{display:none;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:11.5px; color:var(--text2); margin-bottom:4px;}
.field .inwrap{position:relative;}
.field input{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 34px 7px 10px; font-size:12.5px; color:var(--text);}
.field input:focus{outline:none; border-color:var(--accent);}
.field input[type=password]{letter-spacing:2px;}
.eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text3); font-size:13px; user-select:none;}
.hint{font-size:10.5px; color:var(--text3); margin-top:4px; line-height:1.6;}
.hint code{background:#f3f4f6; padding:0 4px; border-radius:4px; font-size:10px; user-select:all;}
.testrow{display:flex; align-items:center; gap:10px;}
.testbtn{background:#fff; color:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:6px 14px; font-size:12px; cursor:pointer;}
.testbtn:disabled{opacity:.5; cursor:wait;}
.test-result{font-size:11.5px;}
.test-result.ok{color:var(--accent);}
.test-result.err{color:#dc2626;}
.savebtn{width:100%; background:var(--accent); color:#fff; border:none; border-radius:9px; padding:9px; font-size:13px; cursor:pointer; margin-top:2px;}
.about{border-top:1px dashed var(--line); margin-top:4px; padding-top:14px; display:flex; gap:12px; align-items:center;}
.about img{width:46px;height:46px;border-radius:50%; box-shadow:0 0 0 2px var(--accent-line);}
.about .an{font-weight:700; font-size:13.5px;}
.about .ad{font-size:11px; color:var(--text2); line-height:1.7; margin-top:2px;}
.storage-note{margin-top:12px; font-size:11px; color:var(--text2); background:#f7f8fa; border:1px solid var(--line); border-radius:8px; padding:8px 10px; line-height:1.7;}

/* Toast */
.toast{position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(8px); background:#111827; color:#fff; font-size:12.5px; padding:8px 16px; border-radius:99px; opacity:0; transition:.25s; z-index:100; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#d6dade; border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#bfc6cc;}
</style>
</head>
<body>

<div class="proto-bar">
  <b>原型演示控制台</b>
  <span style="opacity:.7">模拟数据 · 可交互</span>
  <div class="scenarios">
    <button data-sc="A" class="on">① YouTube 英文（双语）</button>
    <button data-sc="B">② B站 中文</button>
    <button data-sc="C">③ 无字幕（粘贴兜底）</button>
    <button data-sc="D">④ 非视频页</button>
  </div>
</div>

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800); }

function togglePlay(){ playing=!playing; renderPage(); setFollowPill(); }
function updatePlayer(){
  const S=SCN[sc]; if(sc==='D') return;
  const pct = Math.min(100, t/S.duration*100);
  const f=$('#fill'), d=$('#dot'); if(f){f.style.width=pct+'%'; d.style.left=pct+'%';}
  const tm=$('#ctlTime'); if(tm) tm.textContent=fmt(t);
  const cp=$('#centerPlay'); if(cp) cp.textContent = playing?'❚❚':'▶';
  const pl=$('#ctlPlay'); if(pl) pl.textContent = playing?'❚❚':'▶';
}

function loadRows(){
  const S=SCN[sc];
  rows = sc==='A' ? ROWS_A.map(r=>({t:r[0],en:r[1],zh:r[2],tr:cached.A})) :
         sc==='B' ? ROWS_B.map(r=>({t:r[0],zh:r[0+1],en:null,tr:true})) : [];
  if(sc==='A' && !cached.A){ rows.forEach(r=>r.tr=false); trans={done:false,n:0}; startTranslate(); }
  else trans={done:true,n:rows.length};
}
function startTranslate(){
  clearInterval(transTimer);
  transTimer = setInterval(()=>{
    const i = trans.n; if(i>=rows.length){ finishTranslate(); return; }
    rows[i].tr = true; trans.n++;
    const cell = document.querySelector(`[data-zh="${i}"]`);
    if(cell){ cell.classList.remove('pending'); cell.textContent = rows[i].zh; }
    const bar=$('#transBar'), lb=$('#transLb');
    if(bar){ bar.style.width=(trans.n/rows.length*100)+'%'; lb.textContent=`翻译中 ${trans.n}/${rows.length}`; }
  }, 160);
}
function finishTranslate(){
  clearInterval(transTimer); trans.done=true; cached[sc]=true;
  const w=$('#transWrap');
  if(w) w.innerHTML=`<div class="trans-progress"><div class="label"><span>英中对照 · 已缓存 ✓ 二次打开秒出</span><span class="done">完成</span></div><div class="pbar"><i style="width:100%"></i></div></div>`;
}
function renderScript(){
  const pane=$('#pane-script'), S=SCN[sc];
  if(sc==='D'){ pane.innerHTML=`<div class="empty-state"><img src="${LOGO}"><h3>请打开一个视频页面</h3><p>侧边栏会自动识别当前标签页。<br>打开支持的页面后，这里会自动加载该视频的脚本与对话。</p><div class="sites">✓ YouTube（youtube.com/watch）　✓ B站（bilibili.com/video）</div></div>`; return; }
  if(!S.hasSub){
    pane.innerHTML=`<div class="script-wrap">
      <div class="nosub-card">
        <h4>⚠ 该视频没有可用字幕</h4>
        <p>未找到 CC 字幕，且 AI 字幕不可用（可能未登录 B站，或该视频尚未生成）。<br>你可以把别处的脚本/字幕文本粘贴到下面——<b>总结、结构树、对话</b>仍然可用（无时间轴，跟随与跳转不可用）。</p>
        <textarea id="pasteBox" placeholder="把脚本文本粘贴到这里……">${pastedText}</textarea>
        <button class="go" id="pasteGo">使用这段脚本</button>
      </div>
      ${pastedText?`<div class="pasted-note">✓ 已使用粘贴脚本（${pastedText.length} 字）：总结 / 结构树 / 对话 可用；跟随、时间戳跳转、翻译不可用。</div>
      <div class="plainlist">${pastedText.split(/\n+/).filter(Boolean).map(l=>`<div class="pline">${esc(l)}</div>`).join('')}</div>`:''}
    </div>`;
    $('#pasteGo').onclick=()=>{ pastedText=$('#pasteBox').value.trim(); if(!pastedText) return toast('先粘贴一些内容'); setContext(); renderScript(); toast('脚本已就绪，对话/总结可用'); };
    return;
  }
  const transHtml = sc==='A' ? (trans.done
    ? `<div class="trans-progress"><div class="label"><span>英中对照 · 已缓存 ✓ 二次打开秒出</span><span class="done">完成</span></div><div class="pbar"><i style="width:100%"></i></div></div>`
    : `<div id="transWrap"><div class="trans-progress"><div class="label"><span id="transLb">翻译中 0/${rows.length}</span><span>LLM 批量预翻译 · 渐进填充</span></div><div class="pbar"><i id="transBar"></i></div></div></div>`) : '';
  pane.innerHTML=`<div class="script-wrap ${$('#onlyEn')?.classList.contains('on')?'only-en':''}">
    <div class="info-card">
      <div class="t">${S.title}</div>
      <div class="meta">
        <span class="badge lang">${sc==='A'?'EN → ZH':'中文字幕'}</span>
        <span class="badge">${fmt(S.duration)}</span>
        <span class="badge">${rows.length} 行</span>
        <span class="follow-pill" id="followPill">跟随中</span>
      </div>
      ${sc==='A'?`<div class="infobar"><select class="trackselect" id="trackSel">${S.tracks.map(x=>`<option>${x}</option>`).join('')}</select><button class="langtoggle" id="langToggle">仅原文</button></div>`:''}
      ${transHtml}
    </div>
    <div class="transcript" id="transcript">
      ${rows.map((r,i)=>`<div class="row" data-i="${i}">
        <span class="ts">${fmt(r.t)}</span>
        ${r.en?`<div class="en">${esc(r.en)}</div>`:''}
        ${r.zh!==undefined?`<div class="zh ${r.tr?'':'pending'}" data-zh="${i}">${r.tr?esc(r.zh):'翻译中……'}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`;
  $('#transcript').addEventListener('scroll', onManualScroll);
  $$('#transcript .row').forEach(el=> el.onclick=()=>{ seekTo(rows[+el.dataset.i].t); });
  if(sc==='A'){
    $('#langToggle').onclick=e=>{ const w=$('.script-wrap'); const on=w.classList.toggle('only-en'); e.target.textContent = on?'双语对照':'仅原文'; };
    $('#trackSel').onchange=()=>{ toast('已切换字幕轨道，重新拉取脚本（模拟）'); };
  }
  curRow=-1; jumpToRow(true);
}
function onManualScroll(e){
  if(programmatic) return;
  followPaused=true; setFollowPill();
  clearTimeout(pauseTimer);
  pauseTimer=setTimeout(()=>{ followPaused=false; setFollowPill(); },3000);
}
function setFollowPill(){
  const p=$('#followPill'); if(!p) return;
  if(!playing){ p.textContent='已暂停播放'; p.className='follow-pill paused'; }
  else if(followPaused){ p.textContent='手动滚动 · 3秒后恢复跟随'; p.className='follow-pill paused'; }
  else { p.textContent='跟随中'; p.className='follow-pill'; }
}
function currentRowIndex(){ let i=rows.findIndex(r=>r.t>t); return i===-1?rows.length-1:(i>0?i-1:0); }
function jumpToRow(instant){
  if(!rows.length) return;
  const i=currentRowIndex();
  if(i===curRow) return;
  curRow=i;
  const el=document.querySelector(`[data-i="${i}"]`); if(!el) return;
  $$('#transcript .row').forEach(x=>x.classList.remove('cur')); el.classList.add('cur');
  if(!followPaused){
    programmatic=true;
    el.scrollIntoView({block:'center', behavior:instant?'auto':'smooth'});
    setTimeout(()=>programmatic=false, 600);
  }
}
function seekTo(sec){
  t=Math.max(0,sec); updatePlayer(); followPaused=false; clearTimeout(pauseTimer);
  jumpToRow(true); setFollowPill();
}

  const S=SCN[sc];
  if(!chatStore[sc]) chatStore[sc]=[...CHAT_SEED[sc]||[]];

function renderChat(){
  const pane=$('#pane-chat'), S=SCN[sc];

  setContext();

function paintMsgs(){
  const box=$('#msgs');
  box.innerHTML = chatStore[sc].map(m=>`<div class="msg ${m.r}"><div class="who">${m.r==='u'?'你':'讲解助手'}</div><div class="bubble">${m.html}</div></div>`).join('')
    || `<div style="text-align:center;color:var(--text3);font-size:12px;padding:30px 0">开始针对这个视频提问吧 ↓</div>`;
  box.scrollTop=box.scrollHeight; bindTs();
}
function bindTs(){ $$('#msgs a.ts').forEach(a=>a.onclick=()=>{ seekTo(+a.dataset.t); toast(`视频已跳转到 ${fmt(+a.dataset.t)}`); }); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){ return esc(s).replace(/\[(\d{1,2}):(\d{2})\]/g,(m,mm,ss)=>`<a class="ts" data-t="${(+mm)*60+(+ss)}">[${mm}:${ss}]</a>`); }

async function pushAssistant(raw, asPre){
  streaming=true; setQuickDisabled(true);
  const box=$('#msgs');
  const wrap=document.createElement('div'); wrap.className='msg a';
  wrap.innerHTML=`<div class="who">讲解助手</div><div class="bubble"><span class="tx"></span><span class="cursor"></span></div>`;
  box.appendChild(wrap);
  const tx=wrap.querySelector('.tx'); box.scrollTop=box.scrollHeight;
  for(let i=0;i<raw.length;){
    const n=1+Math.floor(Math.random()*3);
    tx.textContent += raw.slice(i,i+n); i+=n;
    box.scrollTop=box.scrollHeight;
    await new Promise(r=>setTimeout(r,22));
  }
  wrap.querySelector('.cursor').remove();
  const b=wrap.querySelector('.bubble');
  b.innerHTML = asPre ? `<pre>${esc(raw)}</pre>` : linkify(raw);
  chatStore[sc].push({r:'a', html:b.innerHTML});
  bindTs(); streaming=false; setQuickDisabled(false);
}
function setQuickDisabled(v){ ['qSummary','qTree','sendBtn'].forEach(id=>{const b=$('#'+id); if(b) b.disabled=v;}); }
function sendUser(){
  if(streaming) return;
  const inp=$('#chatInput'); const v=inp.value.trim(); if(!v) return;
  chatStore[sc].push({r:'u', html:esc(v)});
  inp.value='';
  paintMsgs();
  const pool=CANNED[sc]?.replies||['（模拟回复）这个问题的答案在脚本里有对应段落。'];
  const reply=pool[(chatStore[sc].filter(m=>m.r==='a').length)%pool.length];
  pushAssistant(reply,false);
}
function quick(kind){
  if(streaming) return;
  const c=CANNED[sc]; if(!c) return;
  if(kind==='summary') pushAssistant(c.summary,false);
  else pushAssistant(c.tree,true);
}

      <div class="field"><label>Base URL</label><div class="inwrap"><input id="gu" value="https://open.bigmodel.cn/api/coding/paas/v4"></div><div class="hint">默认官方地址；若使用 <b>GLM Coding Plan</b> 套餐请改用 <code>https://open.bigmodel.cn/api/coding/paas/v4</code></div></div>
      <div class="field"><label>模型名</label><div class="inwrap"><input id="gm" value="glm-5.3-flash"></div></div>
      <div class="testrow"><button class="testbtn" id="gtest">⚡ 连通性测试</button><span class="test-result" id="gres"></span></div>
    </div>

    <div class="cfg-card ${curProv!=='ds'?'hidden':''}" id="card-ds">
      <div class="field"><label>API Key</label><div class="inwrap"><input id="dk" type="password" value="sk-demo0000000000000000"><span class="eye" data-for="dk">👁</span></div><div class="hint">仅保存在本机 chrome.storage.local，界面掩码显示</div></div>
      <div class="field"><label>Base URL</label><div class="inwrap"><input id="du" value="https://api.deepseek.com"></div><div class="hint">默认官方地址，可改为中转 / 代理</div></div>
      <div class="field"><label>模型名</label><div class="inwrap"><input id="dm" value="deepseek-chat"></div></div>
      <div class="testrow"><button class="testbtn" id="dtest">⚡ 连通性测试</button><span class="test-result" id="dres"></span></div>
    </div>

    <button class="savebtn" id="saveCfg">保存配置</button>

    <div class="storage-note">🔒 隐私说明：API Key 与对话记录仅存储在浏览器本地（chrome.storage.local），不进代码仓库、不云同步；脚本内容只发送到你配置的 LLM 服务商，无任何遥测。</div>

    <div class="about">
      <img src="${LOGO}">
      <div><div class="an">视频讲解器 v1.0</div><div class="ad">© 2026 <b>piginzoo</b> · 保留所有权利<br>脚本跟随 × AI 对话 × 一键总结</div></div>
    </div>
  </div>`;
  $$('.prov').forEach(p=>p.onclick=()=>{ curProv=p.dataset.p; renderSettings(); });
  $$('.eye').forEach(e=>e.onclick=()=>{ const i=$('#'+e.dataset.for); i.type = i.type==='password'?'text':'password'; });
  $('#saveCfg').onclick=()=>toast('已保存到 chrome.storage.local（原型模拟）');
  const simTest=(btn,res)=>{ btn.disabled=true; res.className='test-result'; res.textContent='连接中…';
    setTimeout(()=>{ btn.disabled=false; res.className='test-result ok'; res.textContent='✓ 连接成功 · 延迟 342ms'; },900); };
  $('#gtest').onclick=()=>simTest($('#gtest'),$('#gres'));
  $('#dtest').onclick=()=>simTest($('#dtest'),$('#dres'));
}

/* ==================== Tab 与场景切换 ==================== */
$$('.tabs .tab').forEach(tb=>tb.onclick=()=>{
  $$('.tabs .tab').forEach(x=>x.classList.remove('on')); tb.classList.add('on');
  $$('.tabpane').forEach(p=>p.classList.remove('on'));
  $('#pane-'+tb.dataset.tab).classList.add('on');
});
$$('.proto-bar button').forEach(b=>b.onclick=()=>{
  $$('.proto-bar button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  sc=b.dataset.sc; playing=false; t=0; curRow=-1; clearInterval(transTimer);
  if(sc!=='C') pastedText='';
  renderPage(); loadRows(); renderScript(); renderChat(); renderSettings();
});

/* 主循环：模拟播放推进 */
setInterval(()=>{
  if(!playing || sc==='D') return;
  t=Math.min(SCN[sc].duration, t+0.5); updatePlayer();
  if(rows.length) jumpToRow(false);
  if(t>=SCN[sc].duration){ playing=false; updatePlayer(); setFollowPill(); }
},500);

/* 初始 */
renderPage(); loadRows(); renderScript(); renderChat(); renderSettings();
</script>
</body>
